name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core logic tests
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra tests/test_core.cpp -o core_tests
          ./core_tests

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ReactionTrainer.exe dist/ReactionTrainer.exe
          Compress-Archive -Path dist/ReactionTrainer.exe -DestinationPath dist/ReactionTrainer-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReactionTrainer-windows-x64
          path: dist/*
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ReactionTrainer.exe
            dist/ReactionTrainer-windows-x64.zip
          generate_release_notes: true
